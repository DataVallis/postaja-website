name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      setup:
        description: "First run on the host: kamal setup (kamal-proxy behind host nginx is already configured by the app)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      LEAD_TO: ${{ vars.LEAD_TO }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Kamal
        run: gem install kamal -v "~> 2.7" --no-document
      - uses: docker/setup-buildx-action@v3
      - name: SSH key and pinned host key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: First-time setup
        if: github.event_name == 'workflow_dispatch' && inputs.setup
        run: kamal setup
      - name: Deploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.setup) }}
        run: kamal deploy
      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS https://postaja.eu/api/health || true)
            echo "$body" | grep -q "\"sha\":\"${GITHUB_SHA}\"" && break
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q "\"sha\":\"${GITHUB_SHA}\""
          test "$(curl -s -o /dev/null -w '%{http_code}' https://postaja.eu/)" = "200"
