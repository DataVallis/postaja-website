# Host nginx for postaja.eu (same pattern as the app's ops/nginx). Install:
#   sudo cp postaja.eu.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/postaja.eu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d postaja.eu -d www.postaja.eu      # adds the 443 server block and redirect
server {
    listen 80;
    listen [::]:80;
    server_name postaja.eu www.postaja.eu;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
